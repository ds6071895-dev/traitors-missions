<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estate material tiles</title>
<style>body{margin:0;padding:32px;background:#151d20;color:#e9e2d4;font:16px system-ui}h1{font:32px Georgia}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}article{background:#202b2e;padding:14px;border-radius:8px}.tile{height:288px;background-size:96px 96px;border:1px solid #536361}p{max-width:760px;line-height:1.6}small{color:#a7b7b4}</style>
<h1>Highland estate material library</h1><p>Each panel repeats its original raster surface in a 3 × 3 grid. The game combines these colour maps with bump and roughness detail. Prompts and source identifiers are recorded in <a href="manifest.json">the manifest</a>.</p><main></main>
<script>fetch('manifest.json').then(r=>r.json()).then(m=>{for(const item of m.materials){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=item.id;const tile=document.createElement('div');tile.className='tile';tile.style.backgroundImage='url('+item.file+')';const small=document.createElement('small');small.textContent=item.pixels+' px · repeat preview';a.append(h,tile,small);document.querySelector('main').append(a);}});</script></html>
